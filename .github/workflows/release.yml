name: Release

# Cutting a release: bump the version in package.json, then
#   git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # npm provenance

jobs:
  # Gate every release on the offline suites. They need no network, keys or
  # funds, so there is no reason to skip them.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec ts-node smoke/adversarial-offline.ts
      - run: pnpm exec ts-node smoke/adversarial-broadcast.ts
      - run: pnpm exec ts-node smoke/function-coverage.ts

  # pkg cannot cross-compile macOS from Linux (no prebuilt base in its remote
  # cache, and it refuses to build one), so each platform builds on its own
  # runner and uploads just its own artifact.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: node20-linux-x64
            name: offline-signer-linux-x64
          - os: macos-13          # intel
            target: node20-macos-x64
            name: offline-signer-macos-x64
          - os: macos-latest      # apple silicon
            target: node20-macos-arm64
            name: offline-signer-macos-arm64
          - os: windows-latest
            target: node20-win-x64
            name: offline-signer-win-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package binary
        run: pnpm exec pkg dist/bundle.js --targets ${{ matrix.target }} --output dist/executables/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/executables/${{ matrix.name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Operators verify this on the air-gapped machine before trusting a binary.
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Install

            **Online machine** - constructing transactions and broadcasting:
            ```
            npx offline-signer-cli@${{ github.ref_name }} --help
            ```

            **Offline machine** - signing: download the binary for your
            platform below, verify it, then move it across on removable media.
            ```
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```
            The offline machine needs no network, no Node installation and no
            dependency resolution - the binary is self-contained.

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    # Stays skipped until an NPM_TOKEN repository secret exists, so you can cut
    # binary-only releases before deciding to publish to npm.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set - skipping npm publish."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
